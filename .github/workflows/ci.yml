name: 13-Networking2-CI
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # CI 서버 내부 테스트용
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: networking
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 자바 설정 Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: gradle 빌드
        run: ./gradlew build

        # CI용 env
        env:
          DB_URL: jdbc:mysql://localhost:3306/networking?serverTimezone=Asia/Seoul
          DB_USERNAME: root
          DB_PASSWORD: password